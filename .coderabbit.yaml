# CodeRabbit repository configuration:
# https://docs.coderabbit.ai/getting-started/yaml-configuration

language: en-US

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  tools:
    clippy:
      enabled: true
  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Review Rust changes against docs/architecture.md, docs/privacy.md, and docs/api.md. Preserve repository/worktree scoping for code and exact namespace scoping for memory. Keep retrieval deterministic, file processing bounded, and memory writes explicit. Preserve repository-root containment, ignore and credential exclusions, symlink protections, and SQLite migration/version consistency.
    - path: "Cargo.toml"
      instructions: |
        For dependency changes, keep Cargo.lock and THIRD_PARTY_LICENSES.json synchronized. The license inventory is generated by python3 scripts/license_inventory.py.
    - path: "examples/**"
      instructions: |
        Keep these clients as thin stdio MCP adapters to the Rust engine. Preserve the documented runtime assumptions and protocol behavior; do not duplicate indexing or memory logic in a client.
    - path: "docs/**"
      instructions: |
        Check implementation claims against the current source and CLI. Keep performance claims tied to the documented machine and reproduction procedure, and retain explicit platform limitations.
