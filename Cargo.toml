[package]
name = "aether-midnight"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A local-first memory and code retrieval engine for AI agents"
default-run = "aether-midnight"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
ignore = "0.4.34"
libc = "0.2.177"
rusqlite = { version = "0.41.1", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tempfile = "3.27.0"
unicode-normalization = "0.1"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

