[package]
name = "aether-midnight"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A local-first memory and code retrieval engine for AI agents"
default-run = "aether-midnight"

[features]
sqlite-scanstatus = []
retrieval-experiments = []
allocation-diagnostics = ["retrieval-experiments"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
ignore = "0.4.34"
libc = "0.2.177"
rusqlite = { version = "0.41.1", features = ["bundled-full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tempfile = "3.27.0"
unicode-normalization = "0.1"
fastembed = { version = "=5.13.0", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
flate2 = "1.1"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
rainy-sdk = { version = "=0.6.51", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq", "native-tls"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
