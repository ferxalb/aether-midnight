name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'macOS'
        run: cargo +1.98 fmt --check
      - run: cargo +1.98 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.98 test --locked
      - if: runner.os == 'macOS'
        run: |
          node --check npm/midnight.cjs
          node --check npm/prepare.mjs
          sh -n scripts/install.sh
