name: Native release artifacts

# Builds, packages and uploads Universal 2 artifacts and checksums. Pushing a `v*` tag (or running
# this by hand on a tag ref) also publishes the GitHub Release; a branch run only builds.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  universal2:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V

      - name: Build Universal 2 binary (arm64 then x86_64, -j 1)
        run: sh scripts/build-universal.sh

      - name: Package archive and checksum
        run: sh scripts/package-release.sh

      - name: Stage upload directory
        id: stage
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          NAME=aether-midnight-$VERSION-macos-universal2
          mkdir -p dist
          cp "target/release-candidate/$NAME.tar.gz" "target/release-candidate/$NAME.tar.gz.sha256" dist/
          cp scripts/install.sh dist/install.sh
          (cd dist && shasum -a 256 -c "$NAME.tar.gz.sha256")
          lipo -archs target/universal/aether-midnight
          BIN_BYTES=$(stat -f %z target/universal/aether-midnight)
          ARC_BYTES=$(stat -f %z "dist/$NAME.tar.gz")
          {
            echo "### Universal 2 sizes"
            echo "- binary: $BIN_BYTES bytes ($(( BIN_BYTES / 1048576 )) MiB), archs: $(lipo -archs target/universal/aether-midnight)"
            echo "- archive: $ARC_BYTES bytes ($(( ARC_BYTES / 1048576 )) MiB)"
            echo "- sha256: $(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Offline installer smoke test (isolated HOME)
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          NAME=aether-midnight-$VERSION-macos-universal2
          SUM=$(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          sh dist/install.sh --archive-file "dist/$NAME.tar.gz" --sha256 "$SUM" --no-runtime
          "$HOME/.local/bin/aether-midnight" --version
          "$HOME/.local/bin/aether-midnight" --help >/dev/null
          test -L "$HOME/.local/bin/midnight"
          test "$(readlink "$HOME/.local/bin/midnight")" = aether-midnight
          "$HOME/.local/bin/midnight" --version | grep -F "$VERSION"
          "$HOME/.local/bin/midnight" update --help >/dev/null
          "$HOME/.local/bin/midnight" uninstall --dry-run
          # Re-running is idempotent and keeps the link.
          sh dist/install.sh --archive-file "dist/$NAME.tar.gz" --sha256 "$SUM" --no-runtime | grep -F "already"

      - uses: actions/upload-artifact@v4
        with:
          name: aether-midnight-macos-universal2
          path: dist/*
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x64-gnu, binary: aether-midnight}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64-gnu, binary: aether-midnight}
          - {runner: windows-latest, platform: windows-x64, binary: aether-midnight.exe}
          - {runner: windows-11-arm, platform: windows-arm64, binary: aether-midnight.exe}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98 --profile minimal
      - run: cargo +1.98 build --release --locked --bin aether-midnight
      - shell: bash
        run: |
          target/release/${{ matrix.binary }} --version
          sh scripts/package-platform.sh ${{ matrix.platform }} target/release/${{ matrix.binary }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: aether-midnight-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  npm-pack:
    needs: [universal2, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: aether-midnight-*
          merge-multiple: true
          path: dist
      - run: |
          node npm/prepare.mjs dist packages
          for package in packages/*; do
            (cd "$package" && npm pack --dry-run --ignore-scripts)
          done

  release:
    needs: [universal2, native, npm-pack]
    # Only for tag refs; never for a branch run.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: aether-midnight-*
          merge-multiple: true
          path: dist

      - name: Check the tag matches the packaged version
        run: |
          set -eu
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"; exit 1; }
          NAME=aether-midnight-$VERSION-macos-universal2
          test -f "dist/$NAME.tar.gz" && test -f "dist/$NAME.tar.gz.sha256" && test -f dist/install.sh
          (cd dist && for sums in *.tar.gz.sha256; do sha256sum -c "$sums"; done)
          grep -q "^VERSION=$VERSION\$" dist/install.sh
          test -f "docs/release-notes/$GITHUB_REF_NAME.md" || {
            echo "missing docs/release-notes/$GITHUB_REF_NAME.md"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; not modifying it"; exit 1
          fi
          SHA=$(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")
          cp "docs/release-notes/$GITHUB_REF_NAME.md" notes.md
          printf '\nSHA-256 of the archive: `%s`\n' "$SHA" >> notes.md
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/install.sh
